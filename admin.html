```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Card Stuff Yes — Admin</title>


    <style>

        :root {
            --background: #111111;
            --panel: #1c1c1c;
            --panel-secondary: #242424;
            --hover: #303030;

            --text: #ffffff;
            --secondary: #aaaaaa;
            --muted: #888888;

            --border: #383838;
            --button: #444444;
            --button-hover: #555555;

            --success: #4caf50;
            --error: #f44336;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            background:
                var(--background);

            color:
                var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        header {
            width:
                min(
                    calc(100% - 32px),
                    1100px
                );

            margin:
                0 auto;

            padding:
                24px
                0
                20px;

            border-bottom:
                1px solid
                var(--border);
        }


        header h1 {
            margin: 0;
        }


        header p {
            margin:
                6px
                0
                0;

            color:
                var(--secondary);
        }


        nav {
            display: flex;

            gap: 10px;

            margin-top: 20px;

            flex-wrap: wrap;
        }


        button {
            padding:
                10px
                15px;

            background:
                var(--button);

            color:
                var(--text);

            border:
                1px solid
                var(--border);

            border-radius: 6px;

            font: inherit;

            cursor: pointer;
        }


        button:hover {
            background:
                var(--button-hover);
        }


        button.danger {
            color:
                #ffffff;

            border-color:
                var(--error);
        }


        main {
            width:
                min(
                    calc(100% - 32px),
                    1100px
                );

            margin:
                0 auto;

            padding:
                28px
                0
                60px;
        }


        section {
            margin-bottom: 35px;

            padding:
                24px;

            background:
                var(--panel);

            border:
                1px solid
                var(--border);

            border-radius: 10px;
        }


        section h2 {
            margin:
                0
                0
                18px;
        }


        .status {
            min-height: 22px;

            margin-bottom: 20px;

            color:
                var(--secondary);
        }


        .status.success {
            color:
                var(--success);
        }


        .status.error {
            color:
                var(--error);
        }


        .player-list {
            display: grid;

            gap: 10px;
        }


        .player {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding:
                14px;

            background:
                var(--panel-secondary);

            border-radius: 7px;
        }


        .player-name {
            font-weight: bold;
        }


        .player-meta {
            margin-top: 4px;

            color:

            font-size: 13px;
        }


        .news-list {
            display: grid;

            gap: 10px;

            margin-bottom: 24px;
        }


        .news-item {
            padding:
                14px;

            background:

            border-radius: 7px;
        }


        .news-item-header {
            display: flex;

            justify-content: space-between;

            gap: 10px;
        }

            font-weight: bold;

                var(--secondary);

        }

        input,
        textarea,
        select {

        }

            min-height: 180px;

            resize: vertical;
        }


        .form-row {
            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 12px;
        }

        @media (max-width: 650px) {

            .form-row {

    </style>

</head>


<body>

    <header>

        <h1>
            Card Stuff Yes Admin
        </h1>

        <p id="admin-user">
            Checking session...
        </p>


        <nav>

            <button
                id="refresh-button"
                type="button"
            >
                REFRESH
            </button>


            <button
                id="logout-button"
                type="button"
            >
                LOG OUT
            </button>


            <a
                href="./homepage.html"
                style="
                    display:inline-block;
                    padding:10px 15px;
                    color:#ffffff;
                    text-decoration:none;
                    border:1px solid #383838;
                    border-radius:6px;
                    background:#444444;
                "
            >
                HOME
            </a>

        </nav>

    </header>


    <main>

        <div
            id="global-status"
            class="status"
        ></div>


        <!-- =====================================================
             PLAYERS
             ===================================================== -->

        <section>

            <h2>
                Players
            </h2>


            <div
                id="player-list"
                class="player-list"
            >
                Loading...
            </div>

        </section>


        <!-- =====================================================
             NEWS
             ===================================================== -->

        <section>

            <h2>
                News Manager
            </h2>


            <div
                id="news-list"
                class="news-list"
            >
                Loading...
            </div>


            <h3 id="news-form-heading">
                Create News Post
            </h3>


            <form id="news-form">

                <input
                    id="news-id"
                    type="hidden"
                >


                <label for="news-title">
                    Title
                </label>

                <input
                    id="news-title"
                    required
                    maxlength="200"
                >


                <label for="news-summary">
                    Summary
                </label>

                <input
                    id="news-summary"
                    maxlength="500"
                >


                <label for="news-content">
                    Content
                </label>

                <textarea
                    id="news-content"
                    required
                ></textarea>


                <div class="form-row">

                    <div>

                        <label for="news-published">
                            Status
                        </label>

                        <select id="news-published">

                            <option value="1">
                                Published
                            </option>

                            <option value="0">
                                Draft
                            </option>

                        </select>

                    </div>


                    <div>

                        <label for="news-featured">
                            Featured
                        </label>

                        <select id="news-featured">

                            <option value="0">
                                No
                            </option>

                            <option value="1">
                                Yes
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                    >
                        SAVE NEWS
                    </button>


                    <button
                        id="cancel-news-button"
                        type="button"
                    >
                        CANCEL
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script>

        let adminUser = null;


        const statusElement =
            document.getElementById(
                "global-status"
            );


        function showStatus(
            message,
            type = ""
        ) {

            statusElement.textContent =
                message;

            statusElement.className =
                "status " + type;
        }


        async function api(
            url,
            options = {}
        ) {

            const response =
                await fetch(
                    url,
                    {
                        credentials:
                            "same-origin",

                        ...options,

                        headers: {
                            ...(options.headers || {})
                        }
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Request failed."
                );
            }


            return data;
        }


        async function loadAdmin() {

            const data =
                await api(
                    "/api/admin/me"
                );


            adminUser =
                data.player;


            document.getElementById(
                "admin-user"
            ).textContent =
                "Signed in as " +
                adminUser.username +
                " (" +
                adminUser.rank +
                ")";
        }


        async function loadPlayers() {

            const data =
                await api(
                    "/api/admin/players"
                );


            const container =
                document.getElementById(
                    "player-list"
                );


            container.innerHTML =
                "";


            for (
                const player of data.players
            ) {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "player";


                const info =
                    document.createElement(
                        "div"
                    );


                const name =
                    document.createElement(
                        "div"
                    );


                name.className =
                    "player-name";


                name.textContent =
                    player.username;


                const meta =
                    document.createElement(
                        "div"
                    );


                meta.className =
                    "player-meta";


                meta.textContent =
                    "ID " +
                    player.id +
                    " • Rank: " +
                    player.rank +
                    " • ELO: " +
                    player.elo;


                info.appendChild(name);

                info.appendChild(meta);


                const controls =
                    document.createElement(
                        "div"
                    );


                const select =
                    document.createElement(
                        "select"
                    );


                for (
                    const rank of [
                        "player",
                        "mod",
                        "admin",
                        "owner"
                    ]
                ) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        rank;

                    option.textContent =
                        rank;


                    option.selected =
                        rank === player.rank;


                    select.appendChild(
                        option
                    );
                }


                const saveButton =
                    document.createElement(
                        "button"
                    );


                saveButton.textContent =
                    "SAVE RANK";


                saveButton.addEventListener(
                    "click",
                    async () => {

                        try {

                            await api(
                                "/api/admin/players/" +
                                encodeURIComponent(
                                    player.id
                                ) +
                                "/rank",
                                {
                                    method: "PATCH",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            rank:
                                                select.value
                                        })
                                }
                            );


                            showStatus(
                                "Player rank updated.",
                                "success"
                            );


                            await loadPlayers();

                        } catch (error) {

                            showStatus(
                                error.message,
                                "error"
                            );
                        }

                    }
                );


                controls.appendChild(
                    select
                );

                controls.appendChild(
                    saveButton
                );


                row.appendChild(info);

                row.appendChild(
                    controls
                );


                container.appendChild(
                    row
                );
            }
        }


        async function loadNews() {

            const data =
                await api(
                    "/api/admin/news"
                );


            const container =
                document.getElementById(
                    "news-list"
                );


            container.innerHTML =
                "";


            if (
                data.news.length === 0
            ) {

                container.textContent =
                    "No news posts yet.";

                return;
            }


            for (
                const post of data.news
            ) {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "news-item";


                const header =
                    document.createElement(
                        "div"
                    );


                header.className =
                    "news-item-header";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "news-title";


                title.textContent =
                    post.title;


                const postStatus =
                    document.createElement(
                        "div"
                    );


                postStatus.className =
                    "news-status";


                postStatus.textContent =
                    post.published
                        ? "Published"
                        : "Draft";


                header.appendChild(title);

                header.appendChild(
                    postStatus
                );


                const summary =
                    document.createElement(
                        "div"
                    );


                summary.className =
                    "news-summary";


                summary.textContent =
                    post.summary ||
                    "";


                const edit =
                    document.createElement(
                        "button"
                    );


                edit.textContent =
                    "EDIT";


                edit.addEventListener(
                    "click",
                    () => {

                        document.getElementById(
                            "news-id"
                        ).value =
                            post.id;


                        document.getElementById(
                            "news-title"
                        ).value =
                            post.title;


                        document.getElementById(
                            "news-summary"
                        ).value =
                            post.summary || "";


                        document.getElementById(
                            "news-content"
                        ).value =
                            post.content;


                        document.getElementById(
                            "news-published"
                        ).value =
                            post.published
                                ? "1"
                                : "0";


                        document.getElementById(
                            "news-featured"
                        ).value =
                            post.featured
                                ? "1"
                                : "0";


                        document.getElementById(
                            "news-form-heading"
                        ).textContent =
                            "Edit News Post";

                        window.scrollTo({
                            top:
                                document.getElementById(
                                    "news-form"
                                ).offsetTop - 30,

                            behavior:
                                "smooth"
                        });
                    }
                );


                const remove =
                    document.createElement(
                        "button"
                    );


                remove.textContent =
                    "DELETE";


                remove.className =
                    "danger";


                remove.addEventListener(
                    "click",
                    async () => {

                        if (
                            !confirm(
                                "Delete this news post?"
                            )
                        ) {
                            return;
                        }


                        try {

                            await api(
                                "/api/admin/news/" +
                                encodeURIComponent(
                                    post.id
                                ),
                                {
                                    method:
                                        "DELETE"
                                }
                            );


                            showStatus(
                                "News post deleted.",
                                "success"
                            );


                            await loadNews();

                        } catch (error) {

                            showStatus(
                                error.message,
                                "error"
                            );
                        }

                    }
                );


                item.appendChild(header);

                item.appendChild(summary);

                item.appendChild(edit);

                item.appendChild(remove);


                container.appendChild(item);
            }
        }


        function clearNewsForm() {

            document.getElementById(
                "news-form"
            ).reset();


            document.getElementById(
                "news-id"
            ).value =
                "";


            document.getElementById(
                "news-form-heading"
            ).textContent =
                "Create News Post";
        }


        document.getElementById(
            "news-form"
        ).addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const id =
                    document.getElementById(
                        "news-id"
                    ).value;


                const body = {
                    title:
                        document.getElementById(
                            "news-title"
                        ).value.trim(),

                    summary:
                        document.getElementById(
                            "news-summary"
                        ).value.trim(),

                    content:
                        document.getElementById(
                            "news-content"
                        ).value,

                    published:
                        document.getElementById(
                            "news-published"
                        ).value === "1",

                    featured:
                        document.getElementById(
                            "news-featured"
                        ).value === "1"
                };


                try {

                    await api(
                        id
                            ? "/api/admin/news/" +
                              encodeURIComponent(id)
                            : "/api/admin/news",
                        {
                            method:
                                id
                                    ? "PATCH"
                                    : "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    body
                                )
                        }
                    );


                    clearNewsForm();


                    showStatus(
                        "News saved.",
                        "success"
                    );


                    await loadNews();

                } catch (error) {

                    showStatus(
                        error.message,
                        "error"
                    );
                }

            }
        );


        document.getElementById(
            "cancel-news-button"
        ).addEventListener(
            "click",
            clearNewsForm
        );


        document.getElementById(
            "refresh-button"
        ).addEventListener(
            "click",
            async () => {

                try {

                    await loadAdmin();

                    await loadPlayers();

                    await loadNews();

                    showStatus(
                        "Admin data refreshed.",
                        "success"
                    );

                } catch (error) {

                    showStatus(
                        error.message,
                        "error"
                    );
                }

            }
        );


        document.getElementById(
            "logout-button"
        ).addEventListener(
            "click",
            async () => {

                try {

                    await api(
                        "/api/admin/logout",
                        {
                            method: "POST"
                        }
                    );

                    window.location.href =
                        "./admin-login.html";

                } catch (error) {

                    showStatus(
                        error.message,
                        "error"
                    );
                }

            }
        );


        async function initializeAdmin() {

            try {

                await loadAdmin();

                await loadPlayers();

                await loadNews();

            } catch (error) {

                window.location.href =
                    "./admin-login.html";
            }

        }


        initializeAdmin();

    </script>

</body>

</html>
```
