version: 2

updates:

  # =========================================================
  # GITHUB ACTIONS
  # =========================================================

  - package-ecosystem: "github-actions"

    directory: "/"

    schedule:
      interval: "weekly"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "chore"
      include: "scope"
