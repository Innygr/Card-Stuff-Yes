name: Desktop Client
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-client.yml"]
  pull_request:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-client.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Package ${{ matrix.platform }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Test desktop URL security policy
        run: npm test
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Generate SHA-256 checksums (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
      - name: Generate SHA-256 checksums (Linux)
        if: matrix.platform == 'linux'
        run: cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Verify generated checksums (Linux)
        if: matrix.platform == 'linux'
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Verify generated checksums (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $entries = Get-Content dist/SHA256SUMS.txt
          foreach ($entry in $entries) {
            if ($entry -match '^([a-f0-9]{64})  (.+)$') {
              $actual = (Get-FileHash "dist/$($Matches[2])" -Algorithm SHA256).Hash.ToLower()
              if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" }
            } else {
              throw "Invalid checksum entry: $entry"
            }
          }
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: card-stuff-yes-${{ matrix.platform }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14
