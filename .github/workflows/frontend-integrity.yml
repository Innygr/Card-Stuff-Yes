name: Frontend integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check frontend JavaScript syntax
        run: node --check api.js && node --check deckbuild.js && node --check runtime-config.js && node --check account.js && node --check login.js && node --check profile.js && node --check settings.js
      - name: Check local frontend assets
        run: node scripts/check-frontend-integrity.js
