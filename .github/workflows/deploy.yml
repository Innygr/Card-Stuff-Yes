name: Build and Deploy Pages

on:
  push:
    branches:
      - Server
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Server branch
        uses: actions/checkout@v6
        with:
          ref: Server

      - name: Build
        run: |
          echo "Building the current Server-hosted compatibility site..."
          # Deployment stays on Server until the frontend migration to main
          # is complete and the Main deployment has been verified.

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
