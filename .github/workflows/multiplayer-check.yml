name: Multiplayer Prototype Checks

on:
  pull_request:
    branches:
      - Server
  push:
    branches:
      - feature/turn-based-multiplayer

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server and multiplayer client syntax
        run: npm run check
