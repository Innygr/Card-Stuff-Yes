name: Container Image

on:
  pull_request:
    branches:
      - Server
    paths:
      - "server.js"
      - "multiplayer.js"
      - "package.json"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".github/workflows/container-image.yml"
  push:
    branches:
      - Server
    paths:
      - "server.js"
      - "multiplayer.js"
      - "package.json"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".github/workflows/container-image.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Test server and build container
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run multiplayer integration tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag card-stuff-yes:ci .

  publish:
    name: Publish image to GitHub Container Registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/Server'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/innygr/card-stuff-yes
          tags: |
            type=raw,value=server
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
