name: Secret Hygiene
on:
  push:
    branches: [main, Server]
  pull_request:
    branches: [main, Server]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: Scan tracked files for credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
