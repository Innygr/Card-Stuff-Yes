# Card Stuff Yes: branded website error pages
#
# Include this file INSIDE each website server block that should use the
# branded HTML error page. Do not include it in the API server/container.
#
# Example:
#   server {
#       ...
#       root /var/www/cardstuffyes;
#       include /etc/nginx/snippets/cardstuffyes-errors.conf;
#       ...
#   }
#
# The shared page selects its message from the ?code= query parameter.
# The "=<status>" form preserves the original HTTP status code.

error_page 400 =400 /errors/error.html?code=400;
error_page 401 =401 /errors/error.html?code=401;
error_page 403 =403 /errors/error.html?code=403;
error_page 404 =404 /errors/error.html?code=404;
error_page 405 =405 /errors/error.html?code=405;
error_page 408 =408 /errors/error.html?code=408;
error_page 429 =429 /errors/error.html?code=429;
error_page 500 =500 /errors/error.html?code=500;
error_page 502 =502 /errors/error.html?code=502;
error_page 503 =503 /errors/error.html?code=503;
error_page 504 =504 /errors/error.html?code=504;

# Keep the error document available for Nginx internal redirects only.
location = /errors/error.html {
    internal;
    add_header Cache-Control "no-store" always;
}
