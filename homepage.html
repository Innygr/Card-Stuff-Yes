<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ========================================================
         PAGE INFORMATION
         ======================================================== -->

    <!-- Use modern HTML character encoding. -->
    <meta charset="UTF-8">

    <!-- Make the page responsive on phones, tablets, and PCs. -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Browser tab title. -->
    <title>Card Stuff Yes</title>


    <!-- ========================================================
         STYLESHEETS
         ======================================================== -->

    <!--
        Global Card Stuff Yes colors.

        All pages should load colors.css before their
        page-specific CSS.
    -->
    <link
        rel="stylesheet"
        href="/colors.css"
    >

    <!-- Homepage-specific styling. -->
    <link
        rel="stylesheet"
        href="/homepage.css"
    >

</head>


<body>

    <!-- ========================================================
         HEADER
         ======================================================== -->

    <header class="site-header">

        <!-- Website/game name. -->
        <div class="site-title">
            CARD STUFF YES
        </div>


        <!--
            Account controls.

            The username is filled in by homepage.js.
        -->
        <div class="header-account">

            <span id="header-username">
                Not signed in
            </span>


            <a
                id="header-profile-link"
                class="header-link"
                href="/profile"
            >
                Profile
            </a>


            <a
                class="header-link"
                href="/settings.html"
            >
                Settings
            </a>

        </div>

    </header>


    <!-- ========================================================
         MAIN CONTENT
         ======================================================== -->

    <main class="homepage">


        <!-- ====================================================
             HERO
             ==================================================== -->

        <section class="hero-section">

            <h1>
                CARD STUFF YES
            </h1>


            <p class="hero-subtitle">
                Multiplayer Card Game
            </p>


            <!-- Main homepage buttons. -->
            <div class="main-actions">


                <!-- Play the game. -->
                <button
                    id="play-button"
                    class="main-button"
                    type="button"
                >
                    PLAY
                </button>


                <!-- Open the deck builder. -->
                <button
                    id="deck-button"
                    class="main-button"
                    type="button"
                >
                    DECK BUILDER
                </button>


                <!-- Open the news page. -->
                <button
                    id="news-button"
                    class="main-button"
                    type="button"
                >
                    NEWS
                </button>


                <!-- Open the rules. -->
                <button
                    id="how-to-play-button"
                    class="main-button"
                    type="button"
                >
                    HOW TO PLAY
                </button>


                <!-- Open settings. -->
                <button
                    id="settings-button"
                    class="main-button"
                    type="button"
                >
                    SETTINGS
                </button>

            </div>

        </section>


        <!-- ====================================================
             SERVER STATUS
             ==================================================== -->

        <section class="server-section">

            <h2>
                SERVER
            </h2>


            <!-- Server online/offline status. -->
            <div class="server-status">

                <span
                    id="server-status-dot"
                    class="status-dot"
                    aria-hidden="true"
                >
                    ●
                </span>


                <span id="server-status-text">
                    Checking server...
                </span>

            </div>


            <!-- Connected players. -->
            <div class="server-stat">

                <span>
                    Players Online:
                </span>


                <strong id="players-online">
                    0
                </strong>

            </div>


            <!-- Players waiting for a match. -->
            <div class="server-stat">

                <span>
                    Players in Queue:
                </span>


                <strong id="players-queue">
                    0
                </strong>

            </div>


            <!-- Players currently in battles. -->
            <div class="server-stat">

                <span>
                    Players in Battle:
                </span>


                <strong id="players-battle">
                    0
                </strong>

            </div>

        </section>


        <!-- ====================================================
             YOUR PROFILE
             ==================================================== -->

        <section
            id="profile-section"
            class="profile-section"
        >

            <h2>
                YOUR PROFILE
            </h2>


            <!--
                homepage.js replaces this with the signed-in
                player's information.
            -->
            <div id="profile-content">

                <p>
                    Checking your account...
                </p>

            </div>

        </section>


        <!-- ====================================================
             FOOTER
             ==================================================== -->

        <footer class="site-footer">

            <div class="footer-title">
                Card Stuff Yes
            </div>


            <div class="footer-credit">
                Made by Innygr and Mythic
            </div>

        </footer>

    </main>


    <!-- ========================================================
         HOMEPAGE JAVASCRIPT
         ======================================================== -->

    <!--
        defer waits until the HTML has been parsed before
        running the JavaScript.
    -->
    <script
        src="/homepage.js"
        defer
    ></script>

</body>

</html>
