<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Password Recovery - Card Stuff Yes</title>
<link rel="stylesheet" href="./colors.css">
<link rel="stylesheet" href="./login.css">
</head>
<body>
<main class="auth-shell">
<a class="back-link" href="./login.html">← Card Stuff Yes</a>
<header><p class="eyebrow">CARD STUFF YES</p><h1>Password recovery</h1><p class="intro">Reset your account password securely.</p></header>
<section class="auth-card" aria-labelledby="reset-heading">
<h2 id="reset-heading">Choose a new password</h2>
<form id="request-form">
<label for="reset-email">Account email address</label>
<input id="reset-email" name="email" type="email" autocomplete="email" maxlength="254" required>
<button class="primary-button" type="submit">Send password reset email</button>
</form>
<form id="reset-form" hidden>
<label for="new-password">New password</label>
<input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<small>Use 12–128 characters.</small>
<label for="confirm-password">Confirm new password</label>
<input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<button class="primary-button" type="submit">Reset password</button>
</form>
<p id="reset-status" class="status" role="status" aria-live="polite"></p>
<p><a href="./login.html">Return to sign in</a></p>
</section>
</main>
<script src="./runtime-config.js"></script>
<script src="./reset-password.js"></script>
</body>
</html>
