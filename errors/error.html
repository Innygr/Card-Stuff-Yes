<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080812">
  <meta name="robots" content="noindex, nofollow">
  <title>Card Stuff Yes — Something went wrong</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080812;
      color: #f7f5ff;
      --muted: #b8b4ca;
      --line: rgba(255,255,255,.13);
      --panel: rgba(255,255,255,.055);
      --accent: #c084fc;
      --cyan: #67e8f9;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px; min-height: 100vh; margin: 0;
      display: grid; place-items: center; padding: 28px 18px;
      background:
        radial-gradient(ellipse at 16% 8%, rgba(147,51,234,.25), transparent 38rem),
        radial-gradient(ellipse at 88% 70%, rgba(8,145,178,.16), transparent 34rem),
        #080812;
    }
    .card {
      width: min(100%, 620px); padding: clamp(28px, 6vw, 54px);
      border: 1px solid var(--line); border-radius: 22px;
      background: rgba(18, 16, 34, .82); text-align: center;
      box-shadow: 0 24px 90px rgba(0,0,0,.35);
    }
    .brand { color: #fff; font-size: 13px; font-weight: 850; letter-spacing: .14em; text-decoration: none; }
    .playing-card {
      width: 76px; height: 104px; margin: 34px auto 22px;
      display: grid; place-items: center; border: 1px solid rgba(216,180,254,.55);
      border-radius: 12px; background: linear-gradient(145deg, rgba(192,132,252,.22), rgba(103,232,249,.08));
      color: #e9d5ff; font-size: 35px; transform: rotate(-7deg);
      box-shadow: 0 12px 35px rgba(0,0,0,.28);
    }
    .code {
      margin: 0; font-size: clamp(64px, 15vw, 104px); line-height: .95;
      letter-spacing: -.075em;
      background: linear-gradient(100deg, #fff 10%, #d8b4fe 58%, #67e8f9);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { margin: 18px 0 10px; font-size: clamp(22px, 4vw, 30px); }
    .message { max-width: 440px; margin: 0 auto; color: var(--muted); line-height: 1.7; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .button {
      min-height: 48px; display: inline-flex; align-items: center; justify-content: center;
      padding: 0 19px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--panel); color: #fff; font-weight: 750; text-decoration: none; cursor: pointer;
    }
    .button.primary { border-color: transparent; color: #160b25; background: linear-gradient(100deg, #d8b4fe, #67e8f9); }
    .button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
    .footer { margin-top: 34px; color: #89849e; font-size: 12px; }
    @media (prefers-reduced-motion: no-preference) {
      .playing-card { animation: float 4s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) rotate(-7deg); } 50% { transform: translateY(-7px) rotate(-3deg); } }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="error-title">
    <a class="brand" href="https://cardstuffyes.ca/">CARD STUFF YES</a>
    <div class="playing-card" aria-hidden="true">🃏</div>
    <p class="code" id="error-code">404</p>
    <h1 id="error-title">This card isn't in the deck.</h1>
    <p class="message" id="error-message">We couldn't find the page you were looking for. It may have moved, or the link may be outdated.</p>
    <div class="actions">
      <a class="button primary" id="home-link" href="https://cardstuffyes.ca/">Back to home</a>
      <a class="button" id="login-link" href="https://account.cardstuffyes.ca/login.html" hidden>Sign in</a>
      <button class="button" id="retry-button" type="button" hidden>Try again</button>
    </div>
    <p class="footer">Card Stuff Yes · If this keeps happening, try again later.</p>
  </main>
  <script>
    "use strict";
    (function () {
      const errors = {
        400: ["Bad request", "The request couldn't be understood. Check the address or try again."],
        401: ["Sign-in required", "You'll need to sign in to access this page."],
        403: ["Access denied", "Your account doesn't have permission to access this area."],
        404: ["This card isn't in the deck.", "We couldn't find the page you were looking for. It may have moved, or the link may be outdated."],
        405: ["That action isn't available", "This page doesn't accept that type of request."],
        408: ["Request timed out", "That took longer than expected. Please try again."],
        429: ["Whoa, slow down!", "Too many requests were made in a short time. Give it a moment, then try again."],
        500: ["Something went wrong", "An unexpected problem occurred on our side. Please try again later."],
        502: ["Connection interrupted", "A service we rely on didn't respond correctly. Please try again shortly."],
        503: ["Temporarily unavailable", "Card Stuff Yes is temporarily unavailable. Please try again in a little while."],
        504: ["The server took too long", "A service didn't respond in time. Please try again."]
      };
      const params = new URLSearchParams(window.location.search);
      const candidate = Number(params.get("code"));
      const code = Object.prototype.hasOwnProperty.call(errors, candidate) ? candidate : 404;
      const [title, message] = errors[code];
      document.getElementById("error-code").textContent = String(code);
      document.getElementById("error-title").textContent = title;
      document.getElementById("error-message").textContent = message;
      document.title = code + " — " + title + " | Card Stuff Yes";
      if (code === 401) document.getElementById("login-link").hidden = false;
      if ([408, 429, 500, 502, 503, 504].includes(code)) {
        const retry = document.getElementById("retry-button");
        retry.hidden = false;
        retry.addEventListener("click", function () { window.location.reload(); });
      }
    })();
  </script>
</body>
</html>
