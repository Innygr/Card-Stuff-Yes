<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ========================================================
         PAGE INFORMATION
         ======================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Deck Builder - Card Stuff Yes</title>


    <!-- ========================================================
         STYLES
         ======================================================== -->

    <!-- Global Card Stuff Yes colors/theme. -->
    <link
        rel="stylesheet"
        href="/colors.css"
    >

    <!-- Deck Builder-specific styling. -->
    <link
        rel="stylesheet"
        href="/deckbuild.css"
    >

    <link rel="stylesheet" href="/mobile.css">

</head>


<body>

    <!-- ========================================================
         HEADER
         ======================================================== -->

    <header class="deckbuild-header">

        <a
            class="back-button"
            href="/homepage.html"
        >
            ← BACK
        </a>


        <h1>
            DECK BUILDER
        </h1>


        <button
            id="save-deck-button"
            class="save-button"
            type="button"
        >
            SAVE DECK
        </button>

    </header>


    <!-- ========================================================
         PAGE CONTENT
         ======================================================== -->

    <main class="deckbuild-page">


        <!-- Saved decks -->
        <section class="deck-section">
            <div class="section-heading">
                <div>
                    <h2>SAVED DECKS</h2>
                    <p class="section-subtitle">Load or remove a deck saved to your account.</p>
                </div>
            </div>
            <div class="saved-deck-controls">
                <select id="saved-decks" aria-label="Saved decks">
                    <option value="">Choose a saved deck</option>
                </select>
                <button id="load-deck-button" type="button">LOAD</button>
                <button id="new-deck-button" type="button">NEW</button>
                <button id="delete-deck-button" type="button">DELETE</button>
            </div>
            <label for="deck-name">Deck name</label>
            <input id="deck-name" maxlength="40" placeholder="My deck" autocomplete="off">
        </section>

        <!-- ====================================================
             CURRENT DECK
             ==================================================== -->

        <section class="deck-section">

            <div class="section-heading">

                <div>

                    <h2>
                        CURRENT DECK
                    </h2>

                    <p
                        id="deck-count"
                        class="section-subtitle"
                    >
                        0 cards
                    </p>

                </div>

            </div>


            <!--
                JavaScript fills this container with the cards
                currently in the player's deck.
            -->

            <div
                id="current-deck"
                class="card-grid current-deck-grid"
            >

                <p class="loading-message">
                    Loading deck...
                </p>

            </div>

        </section>


        <!-- ====================================================
             UNLOCKED CARDS
             ==================================================== -->

        <section class="cards-section">

            <div class="section-heading">

                <div>

                    <h2>
                        CARD CATALOG
                    </h2>

                    <p class="section-subtitle">
                        Select cards from the available catalog to add them to your deck. Card unlocks and inventory are not connected yet.
                    </p>

                </div>

            </div>


            <!--
                JavaScript creates a section for every card set.

                Example:

                SET 01
                [ S01-01 ] [ S01-02 ] [ S01-03 ]

                SET 02
                [ S02-01 ] [ S02-02 ]
            -->

            <div id="unlocked-cards">

                <p class="loading-message">
                    Loading cards...
                </p>

            </div>

        </section>


        <!-- ====================================================
             STATUS MESSAGE
             ==================================================== -->

        <div
            id="deck-status"
            class="deck-status"
            role="status"
            aria-live="polite"
        ></div>

    </main>


    <!-- ========================================================
         CARD ZOOM OVERLAY
         ======================================================== -->

    <div
        id="card-overlay"
        class="card-overlay hidden"
        aria-hidden="true"
    >

        <div
            id="card-overlay-backdrop"
            class="card-overlay-backdrop"
        ></div>


        <div class="card-overlay-content">

            <button
                id="close-card-overlay"
                class="close-overlay-button"
                type="button"
                aria-label="Close card preview"
            >
                ×
            </button>


            <img
                id="zoomed-card"
                class="zoomed-card"
                src=""
                alt="Card preview"
            >

        </div>

    </div>


    <!-- ========================================================
         JAVASCRIPT
         ======================================================== -->

    <script src="/runtime-config.js" defer></script>
    <script src="/api.js" defer></script>

    <script
        src="/deckbuild.js"
        defer
    ></script>

    <script src="/mobile.js" defer></script>

</body>

</html>
