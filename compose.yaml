services:
  card-stuff-yes:
    image: ghcr.io/innygr/card-stuff-yes:server
    container_name: card-stuff-yes
    init: true
    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 6565
      CSY_STATE_FILE: /app/private-data/multiplayer-state.json
      CSY_DOMAIN: ${CSY_DOMAIN:-cardstuffyes.ca}
      CSY_ALLOWED_ORIGINS: ${CSY_ALLOWED_ORIGINS:-https://cardstuffyes.ca,https://www.cardstuffyes.ca,https://play.cardstuffyes.ca,https://pvp.cardstuffyes.ca,https://cards.cardstuffyes.ca,https://decks.cardstuffyes.ca,https://account.cardstuffyes.ca,https://profile.cardstuffyes.ca,https://settings.cardstuffyes.ca,https://news.cardstuffyes.ca,https://help.cardstuffyes.ca,https://admin.cardstuffyes.ca}
      CSY_COOKIE_SAMESITE: ${CSY_COOKIE_SAMESITE:-Lax}
      CSY_ADMIN_USERS: ${CSY_ADMIN_USERS:-[]}
      CSY_ADMIN_COOKIE_DOMAIN: ${CSY_ADMIN_COOKIE_DOMAIN:-.cardstuffyes.ca}
      CSY_LOG_FILE: /app/private-logs/card-stuff-yes.log

    ports:
      - "6565:6565"

    volumes:
      - card-stuff-yes-data:/app/private-data
      - ./private-logs:/app/private-logs:ro

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    stop_grace_period: 20s

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6565/api/health').then(async r => process.exit(r.ok && (await r.json()).ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  card-stuff-yes-data:
    name: card-stuff-yes-data
